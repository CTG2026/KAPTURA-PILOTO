<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kaptura · Rendimiento combustible</title>
<style>
:root{--bg:#0E0E0E;--card:#1A1A1A;--card2:#232323;--line:#333;--tx:#F2F2F2;--mut:#9A9A9A;--gold:#E8B730;--ok:#1F7A3A;--bad:#E05252}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:16px}
.brand{color:var(--gold);font-weight:800;letter-spacing:2px;font-size:14px}
h1{font-size:24px;margin:8px 0 4px}
.mut{color:var(--mut);font-size:14px}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:10px 0;padding:12px 14px}
summary{cursor:pointer;list-style:none;font-weight:800;font-size:17px}
summary::-webkit-details-marker{display:none}
details>summary:before{content:"▸ ";color:var(--gold)}
details[open]>summary:before{content:"▾ "}
label{display:block;font-size:14px;color:var(--mut);margin:10px 0 4px}
input,select{width:100%;font-size:17px;padding:10px;border-radius:10px;border:1px solid var(--line);background:#111;color:var(--tx)}
.row{display:flex;gap:8px;align-items:center;margin:6px 0}
.row input,.row select{flex:1}
.x{flex:0 0 40px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--bad);font-size:18px}
.btn{display:block;width:100%;padding:14px;border:0;border-radius:12px;font-size:18px;font-weight:800;margin-top:12px;cursor:pointer}
.b1{background:var(--ok);color:#fff}.b2{background:var(--card2);color:var(--tx);border:1px solid var(--line)}.b3{background:var(--gold);color:#000}
.btn:disabled{opacity:.45}
table{width:100%;border-collapse:collapse;font-size:15px}
th{padding:6px 4px;border-bottom:2px solid var(--line);color:var(--mut);font-size:12px;text-align:right}
td{padding:8px 4px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
td:first-child,th:first-child{text-align:left}
td:first-child{white-space:normal;max-width:140px}
table{table-layout:auto}
.sum{cursor:pointer;background:var(--card2)}
.sub{font-size:11px;color:var(--mut)}
.warn{color:var(--bad);font-weight:800}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;overflow:auto;z-index:9}
.ov .box{background:var(--card);max-width:480px;margin:20px auto;border-radius:14px;padding:16px}
.msg{font-size:18px;font-weight:700;margin-top:8px;line-height:1.3}
.link{word-break:break-all;background:#111;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:13px;margin-top:8px}
.tag{display:inline-block;background:var(--card2);border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-size:11px;color:var(--mut)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<div class="ov" id="ov"><div class="box">
  <div style="font-weight:800;font-size:18px;text-align:center">⛽ Foto nivel combustible</div>
  <img id="ov-img" style="width:100%;max-height:33vh;object-fit:contain;border-radius:10px;margin:10px 0">
  <div class="mut" style="text-align:center;font-weight:700">🕒 La hora y el lugar en que se sacó esta foto quedan registrados.</div>
  <label>Patente</label><select id="ov-pat"></select>
  <div id="ov-cond-w"><label>Conductor</label><select id="ov-cond"></select></div>
  <div style="font-weight:800;font-size:19px;margin:14px 0 8px">📏 Kilometraje</div>
  <input id="ov-km" type="number" inputmode="decimal" step="0.1" placeholder="Ej: 602850" style="font-size:26px;text-align:center" oninput="ovVal()">
  <div class="msg" id="ov-msg"></div>
  <label>Litros cargados <span class="tag">en Kaptura llegan solos desde la tarjeta de combustible</span></label>
  <input id="ov-lt" type="number" inputmode="decimal" step="0.1" placeholder="Ej: 250" style="font-size:22px;text-align:center" oninput="ovVal()">
  <button class="btn b1" id="ov-ok" onclick="ovGuardar()" disabled>✔ Guardar</button>
  <button class="btn b2" onclick="ovCerrar()">Cancelar</button>
</div></div>
<input type="file" id="cam" accept="image/*" capture="environment" style="display:none" onchange="ovAbrir(this)">

<script>
/* Kaptura · demo de rendimiento de combustible por empresa.
   La empresa viaja dentro del link (#d=...). Los registros quedan solo en el teléfono de quien prueba (localStorage).
   No usa base de datos ni guarda datos de Transportes Madrid. */
const $=id=>document.getElementById(id);
const TIPOS=[['Tracto',2.6,1],['Camión',3.5,1],['Camión thermo',3.5,1],['Camión con carro',2.6,1],['Semirremolque thermo',null,0],['Semirremolque',null,0],['Carro',null,0]];
const MOTOR=t=>(TIPOS.find(x=>x[0]===t)||[0,0,0])[2]===1;
const COMB=['Aramco','Copec','Shell','Otro'];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n1=v=>Number(v).toLocaleString('es-CL',{maximumFractionDigits:1});
const n2=v=>v==null?'—':v.toFixed(2).replace('.',',');
const dm=iso=>{const d=new Date(iso);return String(d.getDate()).padStart(2,'0')+'-'+String(d.getMonth()+1).padStart(2,'0')};
const enc=o=>btoa(String.fromCharCode(...new TextEncoder().encode(JSON.stringify(o)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const dec=s=>JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0))));
const ls={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let E=null; /* empresa actual */
const keyReg=()=>'kdemo_reg_'+(E.rut||E.nombre).replace(/\W/g,'');

/* ---------- Onboarding ---------- */
function onboarding(pre){
  const e=pre||{nombre:'',rut:'',contacto:'',equipos:[{p:'',t:'Tracto'}],ref:{},conductores:[],comb:'Aramco'};
  window._ob=e;
  $('app').innerHTML='<div class="brand">KAPTURA</div><h1>Nueva empresa</h1><div class="mut">Complete cada sección. Al final se genera el link de la demo.</div>'
  +'<details open><summary>1. Empresa</summary><label>Nombre</label><input id="ob-nom" value="'+esc(e.nombre)+'" placeholder="Ej: Global Solutions SpA"><label>RUT</label><input id="ob-rut" value="'+esc(e.rut)+'" placeholder="Ej: 76.123.456-7"><label>Contacto</label><input id="ob-con" value="'+esc(e.contacto)+'" placeholder="Nombre de la persona"></details>'
  +'<details><summary>2. Equipos <span class="mut" id="ob-neq"></span></summary><div id="ob-eq"></div><button class="btn b2" onclick="obEqAdd()">+ Agregar equipo</button></details>'
  +'<details><summary>3. Rendimiento de referencia</summary><div class="mut">Km/l esperado por tipo. Valores sugeridos: puede cambiarlos.</div><div id="ob-ref"></div></details>'
  +'<details><summary>4. Conductores <span class="mut">(opcional)</span></summary><div id="ob-cd"></div><button class="btn b2" onclick="obCdAdd()">+ Agregar conductor</button></details>'
  +'<details><summary>5. Combustible</summary><label>Proveedor de tarjeta de combustible</label><select id="ob-comb">'+COMB.map(c=>'<option'+(c===e.comb?' selected':'')+'>'+c+'</option>').join('')+'</select></details>'
  +'<button class="btn b1" onclick="obCrear()">✔ Crear empresa</button><div id="ob-out"></div>';
  obEqPintar();obCdPintar();
}
function obLeer(){const e=window._ob;e.nombre=$('ob-nom').value.trim();e.rut=$('ob-rut').value.trim();e.contacto=$('ob-con').value.trim();e.comb=$('ob-comb').value;
  e.equipos=[...document.querySelectorAll('.eq-row')].map(r=>({p:r.querySelector('input').value.trim().toUpperCase().replace(/[^A-Z0-9]/g,''),t:r.querySelector('select').value}));
  e.conductores=[...document.querySelectorAll('.cd-row input')].map(i=>i.value.trim()).filter(Boolean);
  document.querySelectorAll('.ref-in').forEach(i=>{const v=parseFloat(String(i.value).replace(',','.'));if(v>0)e.ref[i.dataset.t]=v});return e}
function obEqPintar(){const e=window._ob;$('ob-eq').innerHTML=e.equipos.map((q,i)=>'<div class="row eq-row"><input value="'+esc(q.p)+'" placeholder="Patente" style="text-transform:uppercase;flex:0 0 105px" oninput="obLeer();$(\'ob-neq\').textContent=\'(\'+window._ob.equipos.filter(q=>q.p).length+\')\'" onchange="obLeer();obRefPintar()"><select onchange="obLeer();obRefPintar()">'+TIPOS.map(t=>'<option'+(t[0]===q.t?' selected':'')+'>'+t[0]+'</option>').join('')+'</select><button class="x" onclick="obLeer();window._ob.equipos.splice('+i+',1);obEqPintar()">✕</button></div>').join('');$('ob-neq').textContent='('+e.equipos.filter(q=>q.p).length+')';obRefPintar()}
function obEqAdd(){obLeer();window._ob.equipos.push({p:'',t:'Tracto'});obEqPintar()}
function obRefPintar(){const e=window._ob,ts=[...new Set(e.equipos.map(q=>q.t))].filter(MOTOR);$('ob-ref').innerHTML=ts.length?ts.map(t=>{const d=(TIPOS.find(x=>x[0]===t)||[])[1];return '<div class="row"><div style="flex:1">'+t+'</div><input class="ref-in" data-t="'+t+'" type="number" step="0.1" inputmode="decimal" value="'+(e.ref[t]??d)+'" style="flex:0 0 110px;text-align:center"><div class="mut">km/l</div></div>'}).join('')+'<div class="mut" style="margin-top:6px">Semirremolques y carros no llevan motor propio: no se mide km/l.</div>':'<div class="mut">Agregue equipos primero.</div>'}
function obCdPintar(){const e=window._ob;$('ob-cd').innerHTML=e.conductores.map((c,i)=>'<div class="row cd-row"><input value="'+esc(c)+'" placeholder="Nombre"><button class="x" onclick="obLeer();window._ob.conductores.splice('+i+',1);obCdPintar()">✕</button></div>').join('')}
function obCdAdd(){obLeer();window._ob.conductores.push('');obCdPintar();const r=document.querySelectorAll('.cd-row input');if(r.length){r[r.length-1].value='';r[r.length-1].focus()}}
function obCrear(){const e=obLeer();e.equipos=e.equipos.filter(q=>q.p);
  if(!e.nombre)return alert('Falta el nombre de la empresa.');
  if(!e.equipos.some(q=>MOTOR(q.t)))return alert('Agregue al menos un equipo con motor (tracto o camión).');
  e.equipos.filter(q=>MOTOR(q.t)).forEach(q=>{if(!e.ref[q.t])e.ref[q.t]=(TIPOS.find(x=>x[0]===q.t)||[])[1]});
  const url=location.href.split('#')[0]+'#d='+enc({v:1,...e});
  $('ob-out').innerHTML='<div style="margin-top:14px;font-weight:800">✔ Empresa creada. Link de la demo:</div><div class="link" id="ob-url">'+esc(url)+'</div><button class="btn b3" onclick="copiar()">📋 Copiar link</button><a class="btn b2" style="text-align:center;text-decoration:none" href="'+esc(url)+'">Abrir la demo</a>'}
function copiar(){const t=$('ob-url').textContent;(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>alert('Link copiado'),()=>{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();alert('Link copiado')})}

/* ---------- Demo ---------- */
function regs(){let R=ls.get(keyReg(),null);if(!R){R=ejemplo();ls.set(keyReg(),R)}return R}
function ejemplo(){/* 3 registros ficticios por equipo con motor, para que la tabla se vea llena */
  const R=[],hoy=Date.now();let s=7;const rnd=()=>{s=(s*9301+49297)%233280;return s/233280};
  E.equipos.filter(q=>MOTOR(q.t)).forEach((q,i)=>{const ref=E.ref[q.t]||3;let km=Math.round(300000+rnd()*500000);
    for(let k=0;k<3;k++){const dk=k?Math.round(450+rnd()*350):0,f=0.85+rnd()*0.25,lt=k?Math.round(dk/(ref*f)*10)/10:Math.round(150+rnd()*150);km+=dk;
      R.push({p:q.p,t:new Date(hoy-(8-k*3)*864e5-i*36e5).toISOString(),km,lt,cd:E.conductores[i%Math.max(1,E.conductores.length)]||'',ej:1})}});
  return R}
function demo(){const R=regs(),M=E.equipos.filter(q=>MOTOR(q.t));
  const TR=[];M.forEach(q=>{const a=R.filter(r=>r.p===q.p).sort((x,y)=>x.t.localeCompare(y.t)),ref=E.ref[q.t];let ak=0,al=0;
    for(let i=1;i<a.length;i++){const dk=a[i].km-a[i-1].km,l=a[i].lt||0;ak+=dk;al+=l;TR.push({p:q.p,d0:a[i-1].t,d1:a[i].t,dk,l,kl:l>0&&dk>0?dk/l:null,ac:al>0&&ak>0?ak/al:null,ref,img:a[i].img})}});
  const kl=(v,r)=>v==null?'—':(v<r*0.85?'<span class="warn">⚠ '+n2(v)+'</span>':'<b>'+n2(v)+'</b>');
  const tab=TR.length?'<table><tr><th>Patente</th><th>Litros</th><th>Km</th><th>Km/l</th><th>Acum.</th><th style="text-align:center">📷</th></tr>'+[...new Set(TR.map(o=>o.p))].map(p=>{const L=TR.filter(o=>o.p===p),u=L[L.length-1],op=(window._acc||{})[p],tl=L.reduce((a,o)=>a+o.l,0),tk=L.reduce((a,o)=>a+o.dk,0),tp=(E.equipos.find(q=>q.p===p)||{}).t;
      return '<tr class="sum" onclick="tog(\''+p+'\')"><td><b><span id="ar-'+p+'">'+(op?'▾':'▸')+'</span> '+esc(p)+'</b><div class="sub">'+esc(tp)+' · '+dm(L[0].d0)+' → '+dm(u.d1)+'</div></td><td><b>'+n1(tl)+'</b></td><td><b>'+n1(tk)+'</b></td><td></td><td>'+kl(u.ac,u.ref)+'</td><td></td></tr>'
      +L.map(o=>'<tr class="fr-'+p+'" style="'+(op?'':'display:none')+'"><td style="padding-left:18px;font-size:13px">'+dm(o.d0)+' → '+dm(o.d1)+'</td><td>'+n1(o.l)+'</td><td>'+n1(o.dk)+'</td><td>'+kl(o.kl,o.ref)+'</td><td>'+n2(o.ac)+'</td><td style="text-align:center">'+(o.img?'<a href="'+o.img+'" target="_blank" style="text-decoration:none;font-size:18px">📷</a>':'')+'</td></tr>').join('')}).join('')+'</table>':'<div class="mut">Aún no hay dos registros de la misma patente.</div>';
  const nm=E.equipos.filter(q=>!MOTOR(q.t));
  $('app').innerHTML='<div class="brand">KAPTURA · '+esc(E.nombre.toUpperCase())+'</div>'
  +'<button class="btn b3" style="font-size:20px;padding:18px" onclick="$(\'cam\').click()">⛽ FOTO NIVEL COMBUSTIBLE</button>'
  +'<h1 style="margin-top:18px">⛽ Rendimiento combustible</h1><div class="mut">Km entre registro de odómetros.</div>'+tab
  +(R.some(r=>r.ej)?'<div class="mut" style="margin-top:8px">Incluye datos de ejemplo. <a href="#" style="color:var(--gold)" onclick="borrarEj();return false">Borrar ejemplo</a></div>':'')
  +'<details><summary>Equipos de la empresa ('+E.equipos.length+')</summary>'+E.equipos.map(q=>'<div class="row"><b style="flex:0 0 90px">'+esc(q.p)+'</b><span class="mut">'+esc(q.t)+(MOTOR(q.t)?' · ref. '+n2(E.ref[q.t])+' km/l':' · sin motor propio')+'</span></div>').join('')+'</details>'
  +'<details><summary>Cómo funciona en Kaptura</summary><div class="mut" style="font-size:15px">1. El conductor carga combustible.<br>2. Saca la foto del tablero en Kaptura y escribe el kilometraje.<br>3. Kaptura une la foto con la carga de la tarjeta '+esc(E.comb)+' por hora y patente.<br>4. El rendimiento por patente se calcula solo, con aviso ⚠ si cae más de 15% bajo la referencia.</div></details>'
  +'<button class="btn b2" onclick="location.hash=\'\'">Crear otra empresa</button>';
}
function tog(p){const o=!(window._acc=window._acc||{})[p];window._acc[p]=o;$('ar-'+p).textContent=o?'▾':'▸';document.querySelectorAll('.fr-'+p).forEach(r=>r.style.display=o?'':'none')}
function borrarEj(){ls.set(keyReg(),regs().filter(r=>!r.ej));demo()}

/* ---------- Foto ---------- */
let F=null;
function ovAbrir(inp){const f=inp.files&&inp.files[0];inp.value='';if(!f)return;F={t:new Date().toISOString()};
  const M=E.equipos.filter(q=>MOTOR(q.t));$('ov-pat').innerHTML=M.map(q=>'<option>'+esc(q.p)+'</option>').join('');
  $('ov-cond-w').style.display=E.conductores.length?'':'none';$('ov-cond').innerHTML=E.conductores.map(c=>'<option>'+esc(c)+'</option>').join('');
  $('ov-km').value='';$('ov-lt').value='';
  const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),k=Math.min(1,480/Math.max(im.width,im.height));c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);F.img=c.toDataURL('image/jpeg',.7);$('ov-img').src=F.img};im.src=URL.createObjectURL(f);
  $('ov').style.display='block';ovVal()}
function ovVal(){const v=parseFloat(String($('ov-km').value).replace(',','.')),l=parseFloat(String($('ov-lt').value).replace(',','.')),m=$('ov-msg'),ok=$('ov-ok');
  const u=regs().filter(r=>r.p===$('ov-pat').value).sort((a,b)=>b.t.localeCompare(a.t))[0];
  if(!(v>=1000)){ok.disabled=true;m.innerHTML='Escriba aquí el kilometraje que marca su tablero.';return}
  if(v>3000000){ok.disabled=true;m.innerHTML='<span class="warn">Revise el número, tiene demasiadas cifras.</span>';return}
  m.innerHTML=u&&v<u.km?'<span style="color:#FFB020">⚠ Es menor que el último registro de esta patente ('+n1(u.km)+' km). Revise antes de guardar.</span>':u&&v>u.km+5000?'<span style="color:#FFB020">⚠ Son '+n1(v-u.km)+' km más que el último registro. Revise antes de guardar.</span>':(l>0?'✔ Listo, toque Guardar.':'Escriba también los litros cargados.');
  ok.disabled=!(l>0)}
function ovGuardar(){const R=regs();R.push({p:$('ov-pat').value,t:F.t,km:parseFloat(String($('ov-km').value).replace(',','.')),lt:parseFloat(String($('ov-lt').value).replace(',','.')),cd:$('ov-cond').value||'',img:F.img});ls.set(keyReg(),R);ovCerrar();(window._acc=window._acc||{})[$('ov-pat').value]=true;demo()}
function ovCerrar(){$('ov').style.display='none';F=null}
$('ov-pat').onchange=ovVal;

/* ---------- Inicio ---------- */
window.addEventListener('hashchange',()=>location.reload());
const h=location.hash.match(/#d=([\w-]+)/);
if(h){try{E=dec(h[1]);demo()}catch(e){$('app').innerHTML='<h1>Link no válido</h1><button class="btn b2" onclick="location.hash=\'\';location.reload()">Crear empresa</button>'}}else onboarding();
</script>
</body>
</html>
