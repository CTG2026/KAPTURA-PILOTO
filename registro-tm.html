*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font-family:'DM Sans',system-ui,sans-serif;min-height:100%}
body{padding:16px 16px 40px;max-width:520px;margin:0 auto}

.btn2{width:100%;border:2px solid var(--border);border-radius:14px;padding:16px;font-size:16px;font-weight:800;font-family:inherit;background:var(--surface);color:var(--text);margin-top:12px}

.thumbs b{position:absolute;top:-6px;right:-6px;background:var(--danger);color:#fff;border-radius:50%;width:22px;height:22px;font-size:13px;display:flex;align-items:center;justify-content:center}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{border:2px solid var(--border);background:var(--surface2);color:var(--text);border-radius:12px;padding:14px;text-align:left;font-size:16px;font-weight:700;font-family:inherit}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--border);background:var(--surface2);color:var(--text);border-radius:30px;padding:10px 14px;font-size:14px;font-weight:700;font-family:inherit}
.chip.sel{border-color:var(--gold);background:#2a2300}
.extra{display:none;margin-top:10px;gap:8px;flex-wrap:wrap}
.extra.on{display:flex}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:12px;font-size:16px;font-family:inherit}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%}
.mini{font-size:12px;color:var(--muted);margin-top:6px}
.ok{font-size:64px;text-align:center;margin:10px 0}

.tblw{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--border);border-radius:12px;margin-bottom:12px}
.tbl{border-collapse:collapse;font-size:12px;min-width:100%;background:#fff;color:#111}.tbl th{background:#1f3a5f;color:#fff;padding:6px 8px;text-align:left;white-space:nowrap}.tbl td{padding:6px 8px;border-bottom:1px solid #ddd;white-space:nowrap}.tbl td.n{text-align:right}.tbl tr.tot td{font-weight:900;background:#eef2f7}
.gps{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px;margin-bottom:12px;font-size:14px}.gps .t{font-weight:900;font-size:15px;margin-bottom:2px}.gps .m{color:var(--muted);font-size:13px}.gps table{width:100%;border-collapse:collapse;margin:8px 0;font-size:13px}.gps td,.gps th{padding:5px 4px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}.gps th{color:var(--muted);font-weight:700}.gps .kpi{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}.gps .kpi div{background:#000;border-radius:8px;padding:6px 8px}.gps .kpi b{display:block;font-size:16px}.gps .al{color:var(--danger);font-weight:800;font-size:13px;margin-top:6px}.ul{color:var(--gold);font-weight:800}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--gold);color:#000;padding:12px 18px;border-radius:10px;font-weight:800;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}

  </div>

    <div class="extra" id="x-reemp"><input type="text" id="reemp-patente" placeholder="Patente del acoplado de reemplazo" style="text-transform:uppercase"></div>
  </div>
  <div class="card">
    <div class="lbl">5 · Observación (opcional)</div>
    <textarea id="obs" rows="2" placeholder="Algo más que contar"></textarea>
  </div>
  <div class="err" id="reg-err"></div>
  <button class="big" id="btn-guardar" onclick="guardar()">GUARDAR</button>
  <button class="btn2" onclick="ir('s-home')">← Volver</button>
</section>

<!-- 4. LISTO -->
<section class="screen" id="s-ok">
  <div class="ok">✅</div>
  <h1 style="text-align:center">Servicio registrado</h1>

  <button class="btn2" onclick="ir('s-home')">Volver al inicio</button>
</section>

<!-- 5. VER REGISTROS (admin / coordinador) -->
<section class="screen" id="s-list">

  <div class="sub" id="list-sub">Cargando…</div>
  <button class="big" id="btn-xls" onclick="descargarExcel()" disabled>⬇ Descargar Excel</button>
  <div style="height:14px"></div>
  <div id="lista"></div>
  <button class="btn2" onclick="ir('s-home')">← Volver</button>
</section>

<!-- 6. REPORTE GPS -->
<section class="screen" id="s-gps">
  <h1>Reporte GPS</h1>
  <input type="date" id="gps-dia" style="width:100%;font-size:18px;padding:10px;border-radius:10px;border:2px solid var(--border);background:var(--surface);color:var(--text);margin-bottom:12px">
  <div class="sub" id="gps-sub">Cargando…</div>
  <div id="gps-lista"></div>
  <button class="btn2" onclick="ir('s-home')">← Volver</button>
</section>

<!-- 7. PROFORMA EBLOOMS -->
<section class="screen" id="s-prof">
  <h1>Proforma EBLOOMS</h1>
  <select id="prof-q" style="width:100%;font-size:17px;padding:10px;border-radius:10px;border:2px solid var(--border);background:var(--surface);color:var(--text);margin-bottom:12px"></select>

  <button class="btn2" onclick="ir('s-home')">← Volver</button>
</section>

let ocrW=null;
async function ocrWorker(){
  if(ocrW)return ocrW;
  ocrW=Tesseract.createWorker('eng',1,{workerPath:'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/worker.min.js',corePath:'https://cdn.jsdelivr.net/npm/tesseract.js-core@5.1.1',langPath:'https://cdn.jsdelivr.net/npm/@tesseract.js-data/eng@1.0.0/4.0.0_best_int'});
  return ocrW;
}
function prepararOCR(file){
  return new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(file);
    img.onload=()=>{const M=2000,r=M/Math.max(img.width,img.height),w=Math.round(img.width*r),h=Math.round(img.height*r);
      const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.drawImage(img,0,0,w,h);
      const d=x.getImageData(0,0,w,h),p=d.data,hist=new Array(256).fill(0),g=new Uint8ClampedArray(w*h);
      for(let i=0,j=0;i<p.length;i+=4,j++){const v=(p[i]*299+p[i+1]*587+p[i+2]*114)/1000|0;g[j]=v;hist[v]++}
      let lo=0,hi=255,acc=0,cut=w*h*0.02;for(;lo<255&&(acc+=hist[lo])<cut;lo++);acc=0;for(;hi>0&&(acc+=hist[hi])<cut;hi--);
      const k=255/Math.max(1,hi-lo);for(let i=0,j=0;i<p.length;i+=4,j++){const v=Math.max(0,Math.min(255,(g[j]-lo)*k));p[i]=p[i+1]=p[i+2]=v}
      x.putImageData(d,0,0);URL.revokeObjectURL(u);res(c)};
    img.onerror=rej;img.src=u});
}
async function leerNumero(file){
  try{
    if(!window.Tesseract)return null;
    const w=await ocrWorker(),c=await prepararOCR(file);
    const {data}=await w.recognize(c,{},{blocks:true});
    const words=[];(data.blocks||[]).forEach(b=>b.paragraphs.forEach(p=>p.lines.forEach(l=>l.words.forEach(x=>words.push(x)))));
    const anc=words.filter(x=>/FACTUR|ELECTR|GU[IÍ]A/i.test(x.text));
    const nums=words.map(x=>({x,m:x.text.match(/^\D{0,3}([1-9]\d{5})\D{0,2}$/)})).filter(o=>o.m);
    let best=null,bd=1e9,ba=null;
    for(const a of anc){const h=a.bbox.y1-a.bbox.y0,ax=(a.bbox.x0+a.bbox.x1)/2;
      for(const o of nums){const b=o.x.bbox,dy=b.y0-a.bbox.y0,dx=Math.abs((b.x0+b.x1)/2-ax);
        if(dy>0&&dy<6*h&&dx<12*h){const d=dy+dx*0.5;if(d<bd){bd=d;best=o.m[1];ba=a}}}}
    // segunda lectura solo de números en el recuadro; se acepta si ambas lecturas coinciden
    const lista=ba?[ba]:anc, vistos=[];
    for(const a of lista.slice(0,3)){const h=a.bbox.y1-a.bbox.y0;
      await w.setParameters({tessedit_char_whitelist:'0123456789'});
      const r=await w.recognize(c,{rectangle:{left:Math.max(0,a.bbox.x0-6*h),top:a.bbox.y1,width:Math.min(18*h,c.width),height:4*h}});
      await w.setParameters({tessedit_char_whitelist:''});
      const ms=[...r.data.text.matchAll(/(?:^|\D)([1-9]\d{5})(?=\D|$)/g)].map(m=>m[1]);vistos.push(...ms);
      if(best&&ms.includes(best))return best;}
    if(!best&&vistos.length&&new Set(vistos).size===1)return null;
  }catch(e){console.log('ocr',e)}
  return null;
}
function comprimir(file){
  return new Promise((res,rej)=>{
    const img=new Image();const u=URL.createObjectURL(file);
    img.onload=()=>{const M=1600;let w=img.width,h=img.height;if(Math.max(w,h)>M){const r=M/Math.max(w,h);w=Math.round(w*r);h=Math.round(h*r)}
      const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
      c.toBlob(b=>b?res(b):rej(),'image/jpeg',0.72);URL.revokeObjectURL(u)};
    img.onerror=rej;img.src=u;
  });
}

async function guardar(){
  const err=$('reg-err');
  if(!fotos.length){err.textContent='Falta la foto de la guía';return}
  if(fotos.some(f=>f.estado==='leyendo')){err.textContent='Espera: se está leyendo el número de la guía';return}
  const sinNum=fotos.findIndex(f=>!f.num);
  if(sinNum>=0){err.textContent='Falta el N° de guía en la foto '+(sinNum+1)+': tome una nueva foto o ingrese el número';return}
  if(!svcSel){err.textContent='Elige el servicio';return}
  if(!$('patente').value){err.textContent='Elige la patente del camión';return}
  if($('peo-box').style.display!=='none'&&$('peoneta').value==='?'){err.textContent='Elige el peoneta (o "Sin peoneta")';return}
  if($('acoplado').value==='?'){err.textContent='Elige el acoplado (o "Sin acoplado")';return}
  const ex=leerExtras();
  if(ex.traspaleteo&&!ex.traspaleteo.pallets){err.textContent='Indica los pallets del traspaleteo';return}
  if(extrasSel.has('reemp')&&!ex.acoplado_reemplazo){err.textContent='Indica la patente del acoplado de reemplazo';return}
  if(svcSel.tarifa===0&&!$('obs').value.trim()){err.textContent='En "Otro" escribe el servicio en la observación';return}
  err.textContent='';
  const ahora=new Date(), id='TM-'+hoyISO(ahora).replace(/-/g,'')+'-'+String(ahora.getHours()).padStart(2,'0')+String(ahora.getMinutes()).padStart(2,'0')+String(ahora.getSeconds()).padStart(2,'0')+'-'+user.pin;
  const reg={
    servicio_id:id, patente:$('patente').value, conductor:user.nombre, cliente:svcSel.cliente||null,
    origen:svcSel.origen||null, destino:svcSel.destino||null, fecha:hoyISO(ahora), estado:'registrado',
    empresa:EMPRESA, modo:'registro_tm', tarifa_neta:svcSel.tarifa||null,
    notas:JSON.stringify({servicio_sistema:svcSel.servicio, acoplado:$('acoplado').value||null, peoneta:($('peo-box').style.display!=='none'&&$('peoneta').value)||null, extras:ex, observacion:$('obs').value.trim()||null, guias:fotos.map(f=>f.num), pin:user.pin, registrado:ahora.toISOString(), fotos:[]})
  };
  const freq=JSON.parse(ls('tm_freq_'+user.pin)||'{}');freq[svcSel.servicio]=(freq[svcSel.servicio]||0)+1;ls('tm_freq_'+user.pin,JSON.stringify(freq));
  ultimo={reg,ex,svc:svcSel,nfotos:fotos.length,ahora};
  const btn=$('btn-guardar');btn.disabled=true;btn.textContent='Guardando…';
  let enviado=false;
  try{ enviado=await enviar(reg,fotos.map(f=>f.blob)); }catch(e){ enviado=false; }
  if(!enviado){ await encolar(reg,fotos.map(f=>f.blob)); }
  btn.disabled=false;btn.textContent='GUARDAR';
  $('ok-sub').textContent=enviado?(svcSel.txt+' · '+fotos.length+' foto(s)'):'Sin señal: quedó guardado en el celular y se enviará solo cuando vuelva la conexión.';
  ir('s-ok'); revisarPendientes();
}
async function enviar(reg,blobs){
  if(!supa||!navigator.onLine)return false;
  const notas=JSON.parse(reg.notas); notas.fotos=[];
  for(let i=0;i<blobs.length;i++){
    const path='tm/'+reg.fecha.slice(0,7)+'/'+reg.servicio_id+'_'+(i+1)+'_'+Math.random().toString(36).slice(2,10)+'.jpg';
    const {error}=await supa.storage.from(BUCKET).upload(path,blobs[i],{contentType:'image/jpeg',upsert:false});
    if(error)throw error;
    notas.fotos.push(supa.storage.from(BUCKET).getPublicUrl(path).data.publicUrl);
  }
  const fila={...reg,notas:JSON.stringify(notas)};
  const {error}=await supa.from('servicios_piloto').insert(fila);
  if(error)throw error;
  return true;
}

// ═══ COLA SIN SEÑAL (IndexedDB) ═══
function db(){return new Promise((res,rej)=>{const r=indexedDB.open('tm_registro',1);r.onupgradeneeded=()=>r.result.createObjectStore('cola',{keyPath:'servicio_id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function encolar(reg,blobs){try{const d=await db();await new Promise((res,rej)=>{const t=d.transaction('cola','readwrite');t.objectStore('cola').put({...reg,blobs});t.oncomplete=res;t.onerror=()=>rej(t.error)})}catch(e){toast('No se pudo guardar en el celular')}}
async function cola(){try{const d=await db();return await new Promise((res,rej)=>{const r=d.transaction('cola').objectStore('cola').getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)})}catch(e){return[]}}
async function sacar(id){const d=await db();await new Promise(res=>{const t=d.transaction('cola','readwrite');t.objectStore('cola').delete(id);t.oncomplete=res})}
let _sync=false;
async function revisarPendientes(){
  if(_sync)return;_sync=true;
  try{
    let pend=await cola();
    for(const p of pend){ const {blobs,...reg}=p; try{ if(await enviar(reg,blobs)) await sacar(reg.servicio_id) }catch(e){} }
    pend=await cola();
    const el=$('pend');el.style.display=pend.length?'block':'none';
    el.textContent=pend.length?('⏳ '+pend.length+' registro(s) esperando señal para enviarse'):'';
  }finally{_sync=false}
}

  let ok=false;
  try{const {data,error}=await supa.from('servicios_piloto').delete().eq('servicio_id',r.servicio_id).eq('empresa',EMPRESA).select('servicio_id');ok=!error&&data&&data.length>0}catch(e){}
  if(!ok){try{const {data,error}=await supa.from('servicios_piloto').update({estado:'anulado'}).eq('servicio_id',r.servicio_id).eq('empresa',EMPRESA).select('servicio_id');ok=!error&&data&&data.length>0}catch(e){}}
  if(ok){toast('Servicio borrado');verRegistros()}else{btn.disabled=false;btn.textContent='Sí, borrar';toast('No se pudo borrar. Revise la conexión.')}
}
function descargarExcel(){

    const obs=[n.observacion,e.trasvasije?'Trasvasije $'+fmt(e.trasvasije.monto_pagado||0):null,e.espera?'Espera '+e.espera.horas+' h':null,e.peaje_efectivo?'Peaje efectivo $'+fmt(e.peaje_efectivo.monto||0):null,e.acoplado_reemplazo?'Acoplado de reemplazo '+e.acoplado_reemplazo+' (costo por confirmar)':null,e.traspaleteo?'Traspaleteo pagado $'+fmt(e.traspaleteo.monto_pagado||0):null,'Registro Kaptura'].filter(Boolean).join(' · ');
    const [y,m,d]=r.fecha.split('-').map(Number);
    return [(Date.UTC(y,m-1,d)-Date.UTC(1899,11,30))/86400000,r.patente,acop,sv,r.conductor,n.peoneta?n.peoneta+' (peoneta)':'',(n.guias||[]).join(' - '),'',e.espera?'Sí':'',e.retorno?(esSuper?'Retorno supermercado':'Sí'):(esSuper?'No':''),'',obs,e.traspaleteo?e.traspaleteo.pallets:'',(n.fotos||[]).join(' '),r.servicio_id,n.registrado?new Date(n.registrado).toLocaleString('es-CL'):''];});
  const ws=XLSX.utils.aoa_to_sheet([head,...rows]);
  ws['!cols']=[{wch:11},{wch:12},{wch:12},{wch:48},{wch:26},{wch:10},{wch:10},{wch:10},{wch:8},{wch:20},{wch:12},{wch:60},{wch:10},{wch:40},{wch:28},{wch:20}];
  for(let i=2;i<=rows.length+1;i++){const c=ws['A'+i];if(c){c.t='n';c.z='dd-mm-yyyy'}}
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Servicios Kaptura');

}

// ═══ REPORTE GPS ═══
const PAT_GPS=p=>String(p||'').toUpperCase().replace(/-\d$/,'').replace(/[^A-Z0-9]/g,'');
const hhmm=d=>d?new Date(d).toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit',hour12:false,timeZone:'America/Santiago'}):'—';
const durTxt=s=>{s=Math.round(s||0);const h=Math.floor(s/3600),m=Math.round((s%3600)/60);return h?h+' h '+String(m).padStart(2,'0')+' min':m+' min'};
const geoCache={};
async function lugar(lat,lon){
  const k=lat.toFixed(4)+','+lon.toFixed(4); if(geoCache[k])return geoCache[k];
  try{const r=await fetch('https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=17&accept-language=es&lat='+lat+'&lon='+lon).then(r=>r.json());
    const a=r.address||{};const t=[a.road||a.pedestrian||a.neighbourhood,a.suburb||a.city_district||a.town||a.village||a.city].filter(Boolean).join(', ');geoCache[k]=t||'—';}catch(e){geoCache[k]='—'}
  await new Promise(r=>setTimeout(r,1100)); return geoCache[k];
}
function diaRango(dia){const ini=new Date(dia+'T00:00:00-03:00');return [ini.toISOString(),new Date(ini.getTime()+86400000).toISOString()]}
async function verGPS(){
  ir('s-gps'); const inp=$('gps-dia');
  if(!inp.value){inp.value=hoyISO();inp.onchange=cargarGPS}
  cargarGPS();
  clearInterval(window._gpsT);window._gpsT=setInterval(()=>{if($('s-gps').classList.contains('on')&&!document.hidden&&$('gps-dia').value===hoyISO())cargarGPS()},180000);
}
async function cargarGPS(){
  const dia=$('gps-dia').value; $('gps-lista').innerHTML=''; $('gps-sub').textContent='Cargando…';
  if(!supa){$('gps-sub').textContent='Sin conexión con la base de datos.';return}
  const [a,b]=diaRango(dia);
  const {data:ev,error}=await supa.from('gps_viajes').select('*').gte('inicio',a).lt('inicio',b).order('inicio');
  if(error){$('gps-sub').textContent='Error: '+error.message;return}
  let q=supa.from('servicios_piloto').select('*').eq('empresa',EMPRESA).eq('modo','registro_tm').neq('estado','anulado').eq('fecha',dia);
  if(esCliente())q=q.eq('cliente',user.cliente);
  const {data:svs}=await q; const servs=(svs||[]).map(r=>({...r,_n:parseNotas(r.notas)}));
  const pats=[...new Set((ev||[]).map(e=>e.patente))].filter(p=>!esCliente()||servs.some(s=>PAT_GPS(s.patente)===PAT_GPS(p)));
  let ult='';
  try{const {data:u}=await supa.from('gps_viajes').select('*').order('inicio',{ascending:false}).limit(1);
    if(u&&u[0]){const x=u[0],fd=t=>new Date(t).toLocaleString('es-CL',{timeZone:'America/Santiago',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
      ult='Último dato GPS: '+fd(x.actualizado)+(esCliente()?'':' · '+x.patente+(x.tipo==='parada'&&!x.fin?' detenido desde '+fd(x.inicio)+' en '+await lugar(x.lat_ini,x.lon_ini):' en movimiento desde '+fd(x.inicio)));}}catch(e){}
  if(!pats.length){$('gps-sub').innerHTML='Sin viajes GPS para '+dia.split('-').reverse().join('-')+'.'+(ult?'<br>'+ult:'');return}
  $('gps-sub').textContent=pats.length+' camión(es) con GPS · leyendo direcciones…';
  let html='';
  for(const p of pats){
    const e=(ev||[]).filter(x=>x.patente===p), vj=e.filter(x=>x.tipo==='viaje'), sv=servs.filter(s=>PAT_GPS(s.patente)===PAT_GPS(p));
    const uls=sv.flatMap(s=>s._n.unidades_logisticas||[]);
    const ini=vj.length?vj[0].inicio:null, fin=vj.length?(vj[vj.length-1].fin||vj[vj.length-1].inicio):null;
    const km=vj.reduce((t,x)=>t+(+x.km||0),0), cond=vj.reduce((t,x)=>t+(x.duracion_s||0),0);
    const paradas=e.filter(x=>x.tipo==='parada'&&ini&&new Date(x.inicio)>=new Date(ini)&&new Date(x.inicio)<new Date(fin));
    const esp=paradas.reduce((t,x)=>t+(x.duracion_s||0),0), vmax=Math.max(0,...vj.map(x=>+x.vel_max||0));
    let filas='<tr><td>—</td><td>'+hhmm(ini)+'</td><td>Salida: '+(vj[0]?await lugar(vj[0].lat_ini,vj[0].lon_ini):'—')+'</td><td></td></tr>';
    for(const x of paradas){
      const ul=uls.find(u=>{if(!u.hora)return false;const t=new Date(dia+'T'+u.hora+':00-03:00');return t>=new Date(x.inicio)-600000&&t<=new Date(x.fin||x.inicio).getTime()+600000});
      filas+='<tr><td>'+hhmm(x.inicio)+'</td><td>'+hhmm(x.fin)+'</td><td>'+(ul?'<span class="ul">'+ul.local+' '+(ul.nombre||'')+(ul.nro?' · Doc. '+ul.nro:'')+'</span><br>':'')+await lugar(x.lat_ini,x.lon_ini)+'</td><td>'+durTxt(x.duracion_s)+'</td></tr>';
    }
    const uv=vj[vj.length-1], ruta=uv&&uv.en_curso;
    filas+=ruta?'<tr><td>—</td><td>—</td><td><b>🚚 En ruta</b> · posición a las '+hhmm(fin)+': '+await lugar(uv.lat_fin,uv.lon_fin)+'</td><td></td></tr>'
      :'<tr><td>'+hhmm(fin)+'</td><td>—</td><td>Fin: '+(vj.length?await lugar(uv.lat_fin,uv.lon_fin):'—')+'</td><td></td></tr>';
    const al=[]; if(vmax>90)al.push('Exceso de velocidad: '+Math.round(vmax)+' km/h');
    const jor=ini&&fin?(new Date(fin)-new Date(ini))/1000:0; if(jor>12*3600)al.push('Jornada de '+durTxt(jor));
    paradas.filter(x=>x.duracion_s>3600).forEach(x=>al.push('Espera de '+durTxt(x.duracion_s)+' desde las '+hhmm(x.inicio)));
    html+='<div class="gps"><div class="t">'+p+' · '+dia.split('-').reverse().join('-')+'</div>'+
      (sv.length?sv.map(s=>'<div class="m">'+SVC_VER(s._n.servicio_sistema)+' · '+s.conductor+((s._n.guias||[]).length?' · Guías '+s._n.guias.join(' - '):'')+(s._n.factura_salida?' · Factura '+s._n.factura_salida:'')+(s._n.peoneta?' + '+s._n.peoneta:'')+'</div>').join(''):'<div class="m">Sin servicio registrado en Kaptura</div>')+
      '<table><tr><th>Llega</th><th>Sale</th><th>Lugar</th><th>Espera</th></tr>'+filas+'</table>'+
      '<div class="kpi"><div>Km<b>'+Math.round(km)+'</b></div><div>Jornada<b>'+durTxt(jor)+'</b></div><div>Conducción<b>'+durTxt(cond)+'</b></div><div>Esperas<b>'+durTxt(esp)+'</b></div>'+(esCliente()?'':'<div>Vel. máx.<b>'+Math.round(vmax)+' km/h</b></div><div>Tramos<b>'+vj.length+'</b></div>')+'</div>'+
      (!esCliente()&&al.length?'<div class="al">⚠ '+al.join('<br>⚠ ')+'</div>':'')+'</div>';
    $('gps-lista').innerHTML=html;
  }
  $('gps-sub').innerHTML=pats.length+' camión(es) con GPS'+(ult?'<br>'+ult:'');
}

// ═══ PROFORMA EBLOOMS ═══
const RUT_COND={'Cristóbal Núñez González':'18465879-8','Esteban Acevedo Toro':'21066784-9','Claudio Madrid Correa':'19262293-K'};
const CHOFER_CORTO=n=>({'Cristóbal Núñez González':'Cristobal Nuñez','Esteban Acevedo Toro':'Esteban Acevedo','Claudio Madrid Correa':'Claudio Madrid','Víctor Medina':'Victor Medina'})[n]||n;
const PAT_PROF=p=>{p=PAT_GPS(p);return p.charAt(0)+p.slice(1).toLowerCase()};
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
function semISO(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const n=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-n);const y=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y)/86400000+1)/7)}
let profFilas=[], profTit='';
function quincenas(){const o=[];const d=new Date();let y=d.getFullYear(),m=d.getMonth(),q=d.getDate()<=15?1:2;for(let i=0;i<6;i++){o.push({y,m,q});if(q===2)q=1;else{q=2;m--;if(m<0){m=11;y--}}}return o}
function verProforma(){
  ir('s-prof'); const sel=$('prof-q');
  if(!sel.options.length){sel.innerHTML=quincenas().map(x=>'<option value="'+x.y+'-'+x.m+'-'+x.q+'">'+(x.q===1?'1ra':'2da')+' quincena '+MESES[x.m]+' '+x.y+'</option>').join('');sel.onchange=cargarProforma}
  cargarProforma();
}
async function cargarProforma(){
  const [y,m,q]=$('prof-q').value.split('-').map(Number); const d1=q===1?1:16, d2=q===1?15:new Date(y,m+1,0).getDate();
  const desde=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d1).padStart(2,'0'), hasta=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d2).padStart(2,'0');
  profTit=(q===1?'1ra':'2da')+' Quincena '+MESES[m];
  $('prof-tbl').innerHTML='';$('btn-prof-xls').disabled=true;$('prof-sub').textContent='Cargando…';
  if(!supa){$('prof-sub').textContent='Sin conexión con la base de datos.';return}
  const {data,error}=await supa.from('servicios_piloto').select('*').eq('empresa',EMPRESA).eq('modo','registro_tm').neq('estado','anulado').eq('cliente','EBLOOMS').gte('fecha',desde).lte('fecha',hasta).order('fecha');
  if(error){$('prof-sub').textContent='Error: '+error.message;return}
  profFilas=(data||[]).map(r=>{const n=parseNotas(r.notas),sv=n.servicio_sistema||'',ex=n.extras||{};
    const locs=(n.unidades_logisticas||[]).slice().sort((a,b)=>(a.hora||'').localeCompare(b.hora||'')).map(u=>u.local+' '+(u.nombre||'').replace(/^JUMBO\s*/i,'').replace(/\b\w/g,c=>c.toUpperCase()).replace(/\B\w+/g,w=>w.toLowerCase()));
    let dst=['','','','',''];
    if(/Chill/i.test(sv)){dst=['N794'+(ex.pallets?' '+ex.pallets+' PALLET':''),'','CHILLAN','','']}
    else{dst=[locs[0]||'',locs[1]||'',locs[2]||'',locs.slice(3).join('/'),'']}
    const obs=[n.observacion_cliente].filter(Boolean).join(' ');if(obs)dst[4]=obs;
    const [yy,mm,dd]=r.fecha.split('-').map(Number);
    return {fecha:r.fecha,cells:[profTit,'',semISO(new Date(yy,mm-1,dd)),'Transporte Madrid',r.fecha.split('-').reverse().join('-'),'Coltauco El Trebol',...dst,PAT_PROF(r.patente),RUT_COND[r.conductor]||'',CHOFER_CORTO(r.conductor),+r.tarifa_neta||0]};});
  const head=['Factura','Canal','Semana','Transporte','Fecha Origen','Origen','Destino 1','Destino 2','Destino 3','Retorno','Destino 5','Patente','RUT','Chofer','Precio'];
  const tot=profFilas.reduce((t,f)=>t+f.cells[14],0);
  $('prof-tbl').innerHTML='<tr>'+head.map(h=>'<th>'+h+'</th>').join('')+'</tr>'+profFilas.map(f=>'<tr>'+f.cells.map((c,i)=>'<td'+(i===14?' class="n"':'')+'>'+(i===14?Number(c).toLocaleString('es-CL'):c)+'</td>').join('')+'</tr>').join('')+
    '<tr class="tot"><td colspan="14">Total '+profTit+'</td><td class="n">'+tot.toLocaleString('es-CL')+'</td></tr>';
  $('prof-sub').textContent=profFilas.length+' viaje(s) · total $'+tot.toLocaleString('es-CL')+' neto';
  $('btn-prof-xls').disabled=!profFilas.length;
}
function descargarProforma(){
  if(!profFilas.length||!window.XLSX)return;
  const head=['Factura','Canal','Semana','Transporte','Fecha Origen','Origen','Destino 1','Destino 2','Destino 3','Retorno','Destino 5','Patente','RUT','Chofer','Precio'];
  const rows=profFilas.map(f=>{const c=f.cells.slice();const [y,m,d]=f.fecha.split('-').map(Number);c[4]=(Date.UTC(y,m-1,d)-Date.UTC(1899,11,30))/86400000;return c});
  const ws=XLSX.utils.aoa_to_sheet([head,...rows]);
  for(let i=2;i<=rows.length+1;i++){ws['E'+i].t='n';ws['E'+i].z='dd-mm-yyyy';ws['O'+i].z='#,##0'}
  const t=rows.length+3; ws['O'+t]={t:'n',f:'SUM(O2:O'+(rows.length+1)+')',v:rows.reduce((a,r)=>a+r[14],0),z:'#,##0'}; ws['!ref']='A1:O'+t;
  ws['!cols']=[{wch:20},{wch:8},{wch:8},{wch:18},{wch:12},{wch:20},{wch:20},{wch:18},{wch:18},{wch:22},{wch:16},{wch:9},{wch:12},{wch:18},{wch:10}];
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,profTit.slice(0,31));
  XLSX.writeFile(wb,'PROFORMA_Transporte_Madrid_'+profTit.replace(/\s+/g,'_')+'_'+$('prof-q').value.split('-')[0]+'.xlsx');
}
